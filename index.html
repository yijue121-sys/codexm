<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简易编辑器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="left">
        <button id="newBtn" title="新建文档">新建</button>
        <label class="file-label" title="打开本地文件">
          打开
          <input id="fileInput" type="file" accept=".txt,.md,text/plain,text/markdown" />
        </label>
        <button id="saveBtn" title="保存到本地">保存</button>
      </div>

      <div class="center">
        <strong>简易编辑器</strong>
      </div>

      <div class="right">
        <button id="undoBtn" title="撤销">撤销</button>
        <button id="redoBtn" title="重做">重做</button>
        <button id="themeBtn" title="切换深浅色主题">切换主题</button>
      </div>
    </header>

    <main class="editor-wrap">
      <textarea id="editor" placeholder="在这里输入内容..."></textarea>
    </main>

    <footer class="status">
      <span id="charCount">字符：0</span>
      <span id="wordCount">单词：0</span>
      <span id="lineCount">行数：1</span>
      <span id="saveState">未保存</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
